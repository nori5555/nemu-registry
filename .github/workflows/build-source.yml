name: Build Rust sources

on:
  push:
    paths:
      - "sources/zh.manwamanhua/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-sources
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build zh.manwamanhua
        run: |
          cargo build --release \
            --manifest-path sources/zh.manwamanhua/Cargo.toml \
            --target wasm32-unknown-unknown
          python3 sources/zh.manwamanhua/package.py \
            --wasm sources/zh.manwamanhua/target/wasm32-unknown-unknown/release/manwamanhua.wasm \
            --out sources/zh.manwamanhua-v6.aix

      - name: Publish package and registry entry
        run: |
          mkdir -p published/icons
          cp sources/zh.manwamanhua-v6.aix published/
          cp sources/zh.manwamanhua/res/icon.png published/icons/zh.manwamanhua-v6.png
          python3 - <<'PY'
          import json, pathlib
          path = pathlib.Path("published/index.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          entry = {
              "id": "zh.manwamanhua",
              "name": "漫蛙漫画",
              "altNames": ["Manwa Manhua"],
              "version": 6,
              "iconURL": "icons/zh.manwamanhua-v6.png",
              "downloadURL": "https://nori5555.github.io/nemu-registry/published/zh.manwamanhua-v6.aix",
              "languages": ["zh"],
              "contentRating": 2,
              "baseURL": "https://manwadz.cc",
              "minAppVersion": "0.7.1",
          }
          sources = [s for s in data["sources"] if s["id"] != "zh.manwamanhua"] + [entry]
          data["sources"] = sources
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          pathlib.Path("published/index.min.json").write_text(
              json.dumps(data, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")
          PY

      - name: Commit artifacts
        run: |
          git add sources/zh.manwamanhua-v6.aix published/
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Build zh.manwamanhua ($(date -u +%Y-%m-%d))"
          git push
