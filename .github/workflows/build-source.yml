name: Build Rust sources

on:
  push:
    paths:
      - "sources/zh.manwamanhua/**"
      - "sources/zh.zaimanhua/**"
      - "templates/zaimanhua/**"
      - "sources/zh.nnhanman/**"
      - "sources/zh.bilicomic/**"
      - "sources/zh.baozimh2/**"
      - "sources/zh.dumanwu/**"
      
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-sources
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build zh.manwamanhua
        run: |
          cargo build --release \
            --manifest-path sources/zh.manwamanhua/Cargo.toml \
            --target wasm32-unknown-unknown
          python3 sources/zh.manwamanhua/package.py \
            --wasm sources/zh.manwamanhua/target/wasm32-unknown-unknown/release/manwamanhua.wasm \
            --out sources/zh.manwamanhua-v8.aix

      - name: Publish package and registry entry
        run: |
          mkdir -p published/icons
          cp sources/zh.manwamanhua-v8.aix published/
          cp sources/zh.manwamanhua/res/icon.png published/icons/zh.manwamanhua-v8.png
          python3 - <<'PY'
          import json, pathlib
          path = pathlib.Path("published/index.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          entry = {
              "id": "zh.manwamanhua",
              "name": "漫蛙漫画",
              "altNames": ["Manwa Manhua"],
              "version": 8,
              "iconURL": "icons/zh.manwamanhua-v8.png",
              "downloadURL": "https://nori5555.github.io/nemu-registry/published/zh.manwamanhua-v8.aix",
              "languages": ["zh"],
              "contentRating": 2,
              "baseURL": "https://manwadz.cc",
              "minAppVersion": "0.7.1",
          }
          sources = [s for s in data["sources"] if s["id"] != "zh.manwamanhua"] + [entry]
          data["sources"] = sources
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          pathlib.Path("published/index.min.json").write_text(
              json.dumps(data, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")
          PY

      - name: Commit artifacts
        run: |
          git add sources/zh.manwamanhua-v8.aix published/
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Build zh.manwamanhua ($(date -u +%Y-%m-%d))"
          git push

      - name: Build zh.zaimanhua
        run: |
          cargo build --release \
            --manifest-path sources/zh.zaimanhua/Cargo.toml \
            --target wasm32-unknown-unknown
          python3 sources/zh.zaimanhua/package.py \
            --wasm sources/zh.zaimanhua/target/wasm32-unknown-unknown/release/zaimanhua.wasm \
            --out sources/zh.zaimanhua-v8.aix

      - name: Publish zh.zaimanhua package and registry entry
        run: |
          mkdir -p published/icons
          cp sources/zh.zaimanhua-v8.aix published/
          cp sources/zh.zaimanhua/res/icon.png published/icons/zh.zaimanhua-v8.png
          python3 - <<'PY'
          import json, pathlib
          path = pathlib.Path("published/index.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          entry = {
              "id": "zh.zaimanhua",
              "name": "再漫画",
              "altNames": [],
              "version": 8,
              "iconURL": "icons/zh.zaimanhua-v8.png",
              "downloadURL": "https://nori5555.github.io/nemu-registry/published/zh.zaimanhua-v8.aix",
              "languages": ["zh"],
              "contentRating": 1,
              "baseURL": "https://www.zaimanhua.com",
              "minAppVersion": "0.7.1",
              "maxAppVersion": None,
          }
          sources = [s for s in data["sources"] if s["id"] != "zh.zaimanhua"] + [entry]
          data["sources"] = sources
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          pathlib.Path("published/index.min.json").write_text(
              json.dumps(data, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")
          PY

      - name: Commit zh.zaimanhua artifacts
        run: |
          git add sources/zh.zaimanhua-v8.aix published/
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Build zh.zaimanhua ($(date -u +%Y-%m-%d))"
          git push

      # zh.nnhanman is an aidoku 0.2.0 source; upstream builds it with
      # cargo +nightly (AlanLang/aidoku-sources build.yaml), so install the
      # nightly toolchain with the wasm target before building it.
      - name: Install nightly toolchain for zh.nnhanman
        run: rustup toolchain install nightly --target wasm32-unknown-unknown

      - name: Build zh.nnhanman
        env:
          RUSTFLAGS: "-C link-arg=--allow-undefined"
        run: |
          cargo +nightly build --release \
            --manifest-path sources/zh.nnhanman/Cargo.toml \
            --target wasm32-unknown-unknown
          python3 sources/zh.nnhanman/package.py \
            --wasm sources/zh.nnhanman/target/wasm32-unknown-unknown/release/nnhanman.wasm \
            --out sources/zh.nnhanman-v3.aix

      - name: Publish zh.nnhanman package and registry entry
        run: |
          mkdir -p published/icons
          cp sources/zh.nnhanman-v3.aix published/
          cp sources/zh.nnhanman/res/Icon.png published/icons/zh.nnhanman-v3.png
          python3 - <<'PY'
          import json, pathlib
          path = pathlib.Path("published/index.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          entry = {
              "id": "zh.nnhanman",
              "name": "鸟鸟韩漫",
              "altNames": [],
              "version": 3,
              "iconURL": "icons/zh.nnhanman-v3.png",
              "downloadURL": "https://nori5555.github.io/nemu-registry/published/zh.nnhanman-v3.aix",
              "languages": ["zh"],
              "contentRating": 2,
              "baseURL": "https://nnhm7.com",
              "minAppVersion": None,
              "maxAppVersion": None,
          }
          sources = [s for s in data["sources"] if s["id"] != "zh.nnhanman"] + [entry]
          data["sources"] = sources
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          pathlib.Path("published/index.min.json").write_text(
              json.dumps(data, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")
          PY

      - name: Commit zh.nnhanman artifacts
        run: |
          git add sources/zh.nnhanman-v3.aix published/
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Build zh.nnhanman ($(date -u +%Y-%m-%d))"
          git push

      # zh.bilicomic is an aidoku 0.2.0 source; upstream builds it with
      # cargo +nightly (suiyuran/aidoku-zh-sources build.sh), and the
      # nightly toolchain was already installed above for zh.nnhanman.
      - name: Build zh.bilicomic
        env:
          RUSTFLAGS: "-C link-arg=--allow-undefined"
