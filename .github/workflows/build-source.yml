              "downloadURL": "https://nori5555.github.io/nemu-registry/published/zh.baozimh2-v7.aix",
              "languages": ["zh"],
              "contentRating": 0,
              "baseURL": "https://baozimh.org",
              "minAppVersion": "0.7.1",
          }
          sources = [s for s in data["sources"] if s["id"] != "zh.baozimh2"] + [entry]
          data["sources"] = sources
