[package]
name = "bilicomic"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
strip = true
lto = false

[dependencies]
# Pinned to the exact aidoku 0.2.0 rev the upstream v4 .aix was built
# against (see Cargo.lock). Current aidoku-rs main (0.3.0) removed the
# #[get_manga_list] macro API this source is written against, so the
# dependency must NOT float.
aidoku = { git = "https://github.com/Aidoku/aidoku-rs", rev = "bae338b15a3840dc0428c7af64fe9fc92abfa2fb", version = "=0.2.0", features = ["helpers"] }
regex = { version = "1.11.1", default-features = false, features = ["unicode"] }
