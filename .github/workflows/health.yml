name: Health probe

on:
  schedule:
    # Weekly on Monday 04:17 UTC (12:17 Asia/Shanghai).
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: health-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build probe runtime (Nemu Aidoku runtime)
        run: |
          echo '{"name":"nemu-registry","private":true}' > package.json
          npm install --no-audit --no-fund @nemu.pm/aidoku-runtime@0.15.0 esbuild
          npx esbuild tools/probe_source.mjs \
            --bundle --platform=node --format=cjs --target=node20 \
            --alias:canvas=tools/stub-canvas.mjs \
            --outfile=tools/probe-runtime.cjs --log-level=warning

      - name: Probe every source in the index
        run: |
          python3 tools/mihon2aidoku.py probe \
            --list index.json \
            --query manga \
            --workers 4 \
            --timeout 75 \
            --out health.json

      - name: Publish health report
        run: |
          git add health.json
          if git diff --cached --quiet; then
            echo "Health unchanged."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Update source health report ($(date -u +%Y-%m-%d))"
          git push