              "downloadURL": "https://nori5555.github.io/nemu-registry/published/zh.bilicomic-v5.aix",
              "languages": ["zh"],
              "contentRating": 0,
              "baseURL": "https://www.bilimanga.net",
              "minAppVersion": "0.7.1",
          }
          sources = [s for s in data["sources"] if s["id"] != "zh.bilicomic"] + [entry]
          data["sources"] = sources
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          pathlib.Path("published/index.min.json").write_text(
              json.dumps(data, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")
          PY

      - name: Commit zh.bilicomic artifacts
        run: |
          git add sources/zh.bilicomic-v5.aix published/
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Build zh.bilicomic ($(date -u +%Y-%m-%d))"
          git push

      # zh.baozimh2 is an aidoku 0.2.0 source; upstream builds it with
      # cargo +nightly (suiyuran/aidoku-zh-sources build.sh).
